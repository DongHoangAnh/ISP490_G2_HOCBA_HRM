# ═══════════════════════════════════════════════════════════════════════
# NGINX stack — file docker-compose ĐỘC LẬP (không override docker-compose.yml).
# Kết nối PostgreSQL hiện hữu qua DB_HOST/DB_PORT trong .env, chạy sau
# reverse proxy nginx tại domain hrm.dangch.tech. Compose này không tạo,
# migrate hay dọn dữ liệu trong database.
#   → Odoo:     127.0.0.1:58012  (nginx proxy_pass vào cổng này)
#   → Volume:    hrm_odoo_data (filestore phải được backup cùng DB)
#
# Cách build + chạy (từ thư mục gốc dự án):
#   docker compose -f docker-compose.nginx.yml up -d --build
# ═══════════════════════════════════════════════════════════════════════

name: hrm

services:
  odoo:
    container_name: hrm-odoo
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "58012:8069"
    environment:
      - HOST=${DB_HOST:?Set DB_HOST in .env}
      - PORT=${DB_PORT:-58010}
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-hocba_hrm}
      - CMS_MYSQL_HOST=${CMS_MYSQL_HOST}
      - CMS_MYSQL_PORT=${CMS_MYSQL_PORT:-58008}
      - CMS_MYSQL_USER=${CMS_MYSQL_USER:-root}
      - CMS_MYSQL_PASSWORD=${CMS_MYSQL_PASSWORD}
      - CMS_MYSQL_DB=${CMS_MYSQL_DB:-erp_database}
    env_file:
      - .env
    volumes:
      - ./custom-addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
      # Dùng chung odoo.local.conf (sslmode=prefer) — cùng kiểu Postgres nội
      # bộ không SSL như stack local, khác odoo.conf gốc (sslmode=require
      # chỉ dành cho Neon).
      - ./odoo.local.conf:/etc/odoo/odoo.conf
    # Không dùng --init/--update/cleanup ở startup: tránh thay schema/data DB
    # production. Migration phải là một thao tác bảo trì được phê duyệt riêng.
    command:
      - odoo
      - --database=${DB_NAME:-hocba_hrm}
      - --db_host=${DB_HOST}
      - --db_port=${DB_PORT:-58010}
      - --db_user=${DB_USER:-odoo}
      - --db_password=${DB_PASSWORD}
      - --db_sslmode=prefer
      - --addons-path=/mnt/extra-addons
    restart: unless-stopped

volumes:
  odoo_data:
