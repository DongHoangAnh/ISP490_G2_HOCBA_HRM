# ═══════════════════════════════════════════════════════════════════════
# LOCAL stack — DB Postgres nội bộ trong Docker. Project name: isp490_g2_hocba_hrm
#   → Odoo:    http://localhost:8069   (port 8069:8069)
#   → Postgres: localhost:5432         (port 5432:5432)
#   → Volumes: isp490_g2_hocba_hrm_odoo_data, isp490_g2_hocba_hrm_postgres_data
#              (TÁCH BIỆT hoàn toàn với online stack hocba_onl)
#
# Cách build + chạy (từ thư mục gốc dự án):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# ═══════════════════════════════════════════════════════════════════════

services:
  db:
    # Volume offline hiện hữu được tạo bởi PostgreSQL 15. Giữ đúng major
    # version để Docker không từ chối khởi động và tuyệt đối không buộc người
    # dùng xoá dữ liệu local. Nâng major phải dùng pg_dump/pg_restore hoặc
    # pg_upgrade theo một kế hoạch migration riêng, không chỉ đổi image tag.
    image: postgres:15
    environment:
      POSTGRES_DB: hocba_hrm
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  odoo:
    depends_on:
      - db
    ports:
      - "8069:8069"      # host 8069 → http://localhost:8069
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo_password
    volumes:
      # Ghi đè odoo.conf gốc (sslmode=require chỉ dành cho Neon)
      - ./odoo.local.conf:/etc/odoo/odoo.conf
    # Danh sách module = 11 module CÓ THẬT trong custom-addons. Trước đây list này
    # còn trỏ vào hr_holidays_modern + 6 module hb_timeoff_* — chúng đã được gộp
    # hết vào hocba_timeoff và XOÁ khỏi đĩa, nên Odoo bỏ qua ("not installable,
    # skipped") và DB local dựng ra KHÔNG có hocba_timeoff. Hậu quả: chạy
    # `-u hocba_timeoff --test-tags /hocba_timeoff` ra "0 of 0 tests" mà vẫn báo OK.
    command: >
      odoo
      --database=hocba_hrm
      --init=hocba_employees,hocba_attendance,hocba_users,hocba_recruitments,hocba_payroll,hocba_hrm,hocba_finance,hocba_service,hocba_reviews,hocba_notify,hocba_timeoff
      --update=hocba_employees,hocba_attendance,hocba_users,hocba_recruitments,hocba_payroll,hocba_hrm,hocba_finance,hocba_service,hocba_reviews,hocba_notify,hocba_timeoff
      --addons-path=/mnt/extra-addons
      --dev=xml

volumes:
  postgres_data:
