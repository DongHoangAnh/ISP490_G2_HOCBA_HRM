# ═══════════════════════════════════════════════════════════════════════
# LOCAL stack — DB Postgres nội bộ trong Docker. Project name: isp490_g2_hocba_hrm
#   → Odoo:    http://localhost:8069   (port 8069:8069)
#   → Postgres: localhost:5432         (port 5432:5432)
#   → Volumes: isp490_g2_hocba_hrm_odoo_data, isp490_g2_hocba_hrm_postgres_data
#              (TÁCH BIỆT hoàn toàn với online stack hocba_onl)
#
# Cách build + chạy (từ thư mục gốc dự án):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# ═══════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hocba_hrm
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  odoo:
    depends_on:
      - db
    ports:
      - "8069:8069"      # host 8069 → http://localhost:8069
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo_password
    volumes:
      # Ghi đè odoo.conf gốc (sslmode=require chỉ dành cho Neon)
      - ./odoo.local.conf:/etc/odoo/odoo.conf
    command: >
      odoo
      --database=hocba_hrm
      --init=hocba_employees,hocba_attendance,hocba_users,hocba_recruitments,hocba_payroll,hocba_hrm,hocba_finance,hr_holidays_modern,hb_timeoff_config,hb_timeoff_policy,hb_timeoff_emergency,hb_timeoff_medical_validation,hb_timeoff_schedule_conflict,hb_timeoff_analytics
      --update=hocba_employees,hocba_attendance,hocba_users,hocba_recruitments,hocba_payroll,hocba_hrm,hocba_finance,hr_holidays_modern,hb_timeoff_config,hb_timeoff_policy,hb_timeoff_emergency,hb_timeoff_medical_validation,hb_timeoff_schedule_conflict,hb_timeoff_analytics
      --addons-path=/mnt/extra-addons
      --dev=xml

volumes:
  postgres_data:
