services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    # Ports được định nghĩa trong override files:
    #   docker-compose.local.yml → 8069:8069 (http://localhost:8069)
    #   docker-compose.onl.yml  → 8070:8069 (http://localhost:8070)
    environment:
      - HOST=${DB_HOST}
      - PORT=${DB_PORT:-5432}
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
      - CMS_MYSQL_HOST=${CMS_MYSQL_HOST}
      - CMS_MYSQL_PORT=${CMS_MYSQL_PORT:-58008}
      - CMS_MYSQL_USER=${CMS_MYSQL_USER:-root}
      - CMS_MYSQL_PASSWORD=${CMS_MYSQL_PASSWORD}
      - CMS_MYSQL_DB=${CMS_MYSQL_DB:-erp_database}
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./custom-addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./tools/fix_stale_assets.py:/fix_stale_assets.py:ro
    command: >
      bash -c "python3 /fix_stale_assets.py; exec odoo
      --database=${DB_NAME:-neondb}
      --addons-path=/mnt/extra-addons
      --dev=xml"

volumes:
  odoo_data:
