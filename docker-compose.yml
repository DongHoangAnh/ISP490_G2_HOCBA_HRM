services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8069:8069"
    environment:
      - HOST=${DB_HOST}
      - PORT=${DB_PORT:-5432}
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
      - CMS_MYSQL_HOST=${CMS_MYSQL_HOST}
      - CMS_MYSQL_PORT=${CMS_MYSQL_PORT:-58008}
      - CMS_MYSQL_USER=${CMS_MYSQL_USER:-root}
      - CMS_MYSQL_PASSWORD=${CMS_MYSQL_PASSWORD}
      - CMS_MYSQL_DB=${CMS_MYSQL_DB:-erp_database}
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./custom-addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
    command: >
      odoo
      --database=${DB_NAME:-neondb}
      --addons-path=/mnt/extra-addons
      --dev=xml

volumes:
  odoo_data:
