[options]
; Dev local: Postgres trong Docker không bật SSL (odoo.conf gốc require cho Neon)
db_sslmode = prefer
; Khai báo thẳng db_host/user/password ở đây (không dựa vào entrypoint.sh tự
; thêm --db_host từ biến môi trường HOST/USER/PASSWORD) — command của service
; odoo là "bash -c ...; exec odoo ..." nên entrypoint.sh KHÔNG nhận diện được
; $1 == "odoo" để tự inject DB_ARGS, dẫn tới Odoo rơi về unix socket local và
; crash ("connection to server on socket ... failed"). Khớp với service "db"
; trong docker-compose.local.yml / docker-compose.nginx.yml.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_password
